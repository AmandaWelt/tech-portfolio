# Build and deploy the portfolio on every push to main.
# Enable once: GitHub repo → Settings → Pages → Source: GitHub Actions

name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install and build
        env:
          # GitHub project site: https://<user>.github.io/tech-portfolio/
          # Custom domain at root (e.g. amandawelt.com): set repo variable PUBLIC_URL to /
          PUBLIC_URL: ${{ vars.PUBLIC_URL || '/tech-portfolio' }}
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deploy
        uses: actions/deploy-pages@v4
